<div class="main-wrapper bg-light-yellow min-vh-100">
  <div class="header-section d-flex align-items-center gap-2 mb-4">
    <img class="brand-logo" src="assets/images/logoReceipt.png" alt="Logo" />
    <span *ngIf="isUAT" class="badge-uat">UAT</span>
  </div>

  <div class="hero-section text-center mb-4">
    <img
      class="hero-illustration"
      src="assets/images/disaledownload.svg"
      alt="Download Illustration"
    />
  </div>

  <div class="content-card">
    <h1 class="title mb-4 text-center">ดาวน์โหลด Di-Sales Mobile Application</h1>

    <div class="version-info-card mb-4">
      <h4 class="version-title mb-3">
        <i class="bi bi-star-fill me-2"></i>Di-Sales version 41.2.0 มีอะไรใหม่
      </h4>
      <ul class="feature-list list-unstyled mb-0">
        <li class="feature-item">
          <i class="bi bi-check-circle-fill me-2"></i>
          <span>ปรับปรุงระบบเพื่อเพิ่มประสิทธิภาพในการใช้งานให้ดีขึ้น</span>
        </li>
        <li class="feature-item">
          <i class="bi bi-check-circle-fill me-2"></i>
          <span>DSFL-4901</span>
        </li>
        <li class="feature-item">
          <i class="bi bi-check-circle-fill me-2"></i>
          <span>DSFL-4874</span>
        </li>
        <li class="feature-item">
          <i class="bi bi-check-circle-fill me-2"></i>
          <span>DSFL-4897</span>
        </li>
        <li class="feature-item">
          <i class="bi bi-check-circle-fill me-2"></i>
          <span>DSFL-4995</span>
        </li>
      </ul>
    </div>

    <div class="platform-selector-section text-center">
      <p class="platform-prompt mb-4">กรุณาเลือกแพลตฟอร์มของคุณ</p>

      <div class="platforms d-flex justify-content-center gap-3 flex-wrap">
        <a
          *ngFor="let link of links"
          class="platform-link"
          [href]="link.url"
        >
          <i *ngIf="link.icon === 'android'" class="bi bi-google-play"></i>
          <i *ngIf="link.icon === 'apple'" class="bi bi-apple"></i>
          <span class="platform-name">{{ link.name }}</span>
        </a>
      </div>
    </div>

    <div class="release-info text-center mt-4">
      <span class="release-badge">
        <i class="bi bi-calendar-check me-2"></i>Release Date: 19/01/2026
      </span>
    </div>
  </div>
</div>
