<div class="main-wrapper bg-light-yellow min-vh-100 p-4 text-center">
  <div class="text-start d-flex align-items-center gap-2">
    <img class="brand-logo" src="assets/images/logoReceipt.png" alt="Logo" />
    <span *ngIf="isUAT" class="badge-uat">UAT</span>
  </div>

  <div class="text-center my-4">
    <img
      class="hero-illustration"
      src="assets/images/disaledownload.svg"
      alt="Download Illustration"
    />
  </div>

  <div class="container text-center">
    <h1 class="title mb-3">ดาวน์โหลด Di-Sales Mobile Application</h1>

    <div class="description mb-4">
      <h4 class="d-inline-flex">Di-Sales version 41.1.0 มีอะไรใหม่ :</h4>
      <ul class="list-unstyled">
        <li>
          <span class="bullet-yellow">•</span
          >ปรับปรุงระบบเพื่อเพิ่มประสิทธิภาพในการใช้งานให้ดีขึ้น
        </li>
        <li><span class="bullet-yellow">• </span>Support 16 KB page sizes</li>
      </ul>
    </div>

    <p class="mb-4">กรุณาเลือกแพลตฟอร์มของคุณ</p>

    <div
      class="platforms d-flex justify-content-center gap-3 gap-md-4 flex-wrap"
    >
      <a
        *ngFor="let link of links"
        class="platform-link btn btn-outline-dark d-inline-flex align-items-center justify-content-center gap-2 px-4 py-2"
        [href]="link.url"
      >
        <i *ngIf="link.icon === 'android'" class="bi bi-google-play fs-4"></i>
        <i *ngIf="link.icon === 'apple'" class="bi bi-apple fs-4"></i>
        {{ link.name }}
      </a>
    </div>
  </div>

  <p class="mt-5">
    <span class="badge bg-secondary">Release Date: 21/11/2025</span>
  </p>
</div>
